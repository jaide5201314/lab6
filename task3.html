<!DOCTYPE html>
<html>
<head>
	<title>Continental Hotel Reservation Form</title>

	<style>
		body {
			background-color: lightgrey;
		}

		h3 {
			color: red;
			text-align: center;
			font-family: Arial;
		}

		table {
			margin: auto;
			background-color: lightblue;
 			border: 2px solid black;
		}

		td {
			border: 1px solid black;
			padding: 5px;
			font-size: 15px;
		}

		.col1 {
			text-align: right;
 			font-weight: bold;
		}
	</style>
</head>

<body>

	<h3>Continental Hotel Reservation Form</h3>
		<form>
			<table>
				<tr>
					<td class="col1">Name</td>
					<td> <input type="text" placeholder="Enter your full name"> </td>
				</tr>

				<tr>
					<td class="col1">eMail</td>
					<td> <input type="email" value="info@continental.pk"> </td>
				</tr>

				<tr>
					<td class="col1">Mobile No</td>
					<td> <input type="text" placeholder="Enter your cell number"> </td>
				</tr>

				<tr>
					<td class="col1">Arrival Time</td>
					<td> <input type="time"> </td>
				</tr>

				<tr>
					<td class="col1">Departure</td>
					<td> <input type="time"> </td>
				</tr>

				<tr>
					<td class="col1">Room Type</td>
					<td>
						<input type="radio" name="roomtype" value="single"> Single
						<input type="radio" name="roomtype" value="double"> Double
						<br>
						<input type="radio" name="roomtype" value="suite"> Presidential Suite
					</td>
				</tr>

				<tr>
					<td class="col1">Preferences</td>
					<td>
						<input type="checkbox" name="non-smoking"> Non-Smoking
						<br>
						<input type="checkbox" name="internet"> Internet
						<br>
						<input type="checkbox" name="mattress"> Firm Mattress
					</td>
				</tr>

				<tr>
					<td class="col1">Mode of Payment</td>
					<td>
						<input type="checkbox" name="cash"> Cash
						<input type="checkbox" name="check"> Check
						<br>
						<input type="checkbox" name="credit"> Credit Card

						<button type="submit">Select Card</button>
					</td>
				</tr>

				<tr>
					<td colspan="2" align="center"> <button type="submit">Send Data</button> </td>
				</tr>
		</table>
	</form>
</body>
</html>
